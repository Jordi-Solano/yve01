services:
  - type: web
    name: yve01-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    # 1 worker + threads keeps los locks de pipeline (_pipeline_running) efectivos
    # y permite concurrencia para SSE (chat, procesar) + API a la vez.
    startCommand: gunicorn dashboard:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        value: yve01-prod-secret-2026-stable-key-do-not-regenerate
