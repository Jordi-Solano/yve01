<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sin conexión · Yve.01</title>
<link rel="icon" href="/static/icons/favicon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0f172a;color:#f1f5f9;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;position:relative;overflow:hidden;line-height:1.5
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 500px at 90% -5%,rgba(59,130,246,.12),transparent 60%),
      radial-gradient(700px 400px at -5% 105%,rgba(139,92,246,.09),transparent 55%)
  }
  .card{
    position:relative;z-index:1;text-align:center;max-width:420px;width:100%;
    background:#1e293b;border:1px solid #334155;border-radius:20px;
    padding:40px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4)
  }
  .logo{width:76px;height:76px;margin:0 auto 22px;display:block;
    filter:drop-shadow(0 6px 20px rgba(59,130,246,.35))}
  .brand{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
  .brand span{color:#60a5fa}
  .pulse{
    display:inline-flex;align-items:center;gap:8px;margin:14px 0 6px;
    font-size:12px;color:#f59e0b;font-weight:600;
    background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);
    padding:5px 12px;border-radius:20px
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  h1{font-size:22px;font-weight:700;margin:16px 0 10px}
  p{font-size:14px;color:#94a3b8;margin-bottom:26px}
  button{
    background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;
    padding:13px 28px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 20px rgba(59,130,246,.4);transition:.15s;width:100%
  }
  button:hover{transform:translateY(-1px);box-shadow:0 6px 26px rgba(59,130,246,.5)}
  .hint{margin-top:16px;font-size:11px;color:#64748b}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/static/icons/yve-logo-192.png" alt="Yve.01">
    <div class="brand">Yve<span>.01</span></div>
    <div class="pulse"><span class="dot"></span> SIN CONEXIÓN</div>
    <h1>Sin conexión</h1>
    <p>Reconecta para actualizar. Tus datos financieros se sincronizarán automáticamente en cuanto vuelvas a tener red.</p>
    <button onclick="location.reload()">↻ Reintentar</button>
    <div class="hint">Yve.01 · Finanzas hoteleras AI</div>
  </div>
  <script>
    // Reintenta solo cuando el navegador recupera la conexión
    window.addEventListener('online', function(){ location.reload(); });
  </script>
</body>
</html>
